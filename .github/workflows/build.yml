# Every push and pull request: run the tests and build the x64 + ARM64 MSIX
# packages, bundled into one .msixbundle (downloadable from the run's artifacts).
#
# Pushing a tag vX.Y.Z also creates a draft GitHub release with the bundle
# attached. The tag must match Package.appxmanifest: v1.0.1 needs 1.0.1.0.
#
# Requires the repository secret CARDS_CLIENT_ID (the Trello OAuth client ID).
# Without it the build uses the placeholder ID, which is fine for tests but not
# for a release, so tag builds fail when the secret is missing.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: CardsExtension/CardsExtension.csproj
  TEST_PROJECT: CardsExtension.Tests/CardsExtension.Tests.csproj
  MANIFEST: CardsExtension/Package.appxmanifest

jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle-name: ${{ steps.version.outputs.bundle-name }}
    defaults:
      run:
        shell: pwsh
    env:
      # MSBuild reads environment variables as properties; the csproj compiles this in.
      CardsClientId: ${{ secrets.CARDS_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read package version
        id: version
        run: |
          [xml]$manifest = Get-Content $env:MANIFEST -Raw
          $name    = $manifest.Package.Identity.Name
          $version = $manifest.Package.Identity.Version
          [xml]$proj = Get-Content $env:PROJECT -Raw
          $projVersion = ($proj.Project.PropertyGroup.AppxPackageVersion | Where-Object { $_ }) -join ''

          if ($projVersion -ne $version) {
            throw "AppxPackageVersion in the csproj ($projVersion) differs from Package.appxmanifest ($version)."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.0$') {
            throw "Manifest version $version must have four parts with the last one 0 (Store requirement)."
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expected = $env:GITHUB_REF_NAME.TrimStart('v') + '.0'
            if ($expected -ne $version) {
              throw "Tag $env:GITHUB_REF_NAME needs manifest version $expected, but the manifest says $version."
            }
            if ([string]::IsNullOrEmpty($env:CardsClientId)) {
              throw 'The CARDS_CLIENT_ID secret is not set; a release build would ship the placeholder client ID.'
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "bundle-name=${name}_${version}.msixbundle" >> $env:GITHUB_OUTPUT
          Write-Host "Package $name, version $version"

      - name: Test
        run: dotnet test $env:TEST_PROJECT -c Release -p:Platform=x64

      - name: Build MSIX packages (x64, ARM64)
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            dotnet build $env:PROJECT -c Release -p:Platform=$platform `
              -p:GenerateAppxPackageOnBuild=true -p:AppxBundle=Never -v:minimal
            if ($LASTEXITCODE -ne 0) { throw "$platform build failed." }
          }

      - name: Create .msixbundle
        run: |
          $sdkBin = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $makeappx = Get-ChildItem $sdkBin -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\makeappx.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under $sdkBin." }
          Write-Host "makeappx: $makeappx"

          $version = '${{ steps.version.outputs.version }}'
          $stage = 'out/stage'
          New-Item -ItemType Directory -Force $stage | Out-Null

          foreach ($arch in 'x64', 'arm64') {
            $msix = Get-ChildItem CardsExtension/AppPackages -Recurse -Filter "*_${version}_${arch}.msix" |
              Select-Object -First 1
            if (-not $msix) { throw "No $arch .msix for version $version under CardsExtension/AppPackages." }
            Write-Host "$arch package: $($msix.FullName)"
            Copy-Item $msix.FullName $stage
          }

          $bundle = 'out/${{ steps.version.outputs.bundle-name }}'
          & $makeappx bundle /d $stage /p $bundle /bv $version /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx bundle failed.' }

          $verify = 'out/verify'
          & $makeappx unbundle /p $bundle /d $verify /o | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'makeappx unbundle verification failed.' }
          [xml]$bundleXml = Get-Content "$verify/AppxMetadata/AppxBundleManifest.xml" -Raw
          $archs = $bundleXml.Bundle.Packages.Package | ForEach-Object { $_.Architecture }
          Write-Host "Bundle architectures: $($archs -join ', ')"
          if (@($archs).Count -ne 2) { throw 'The bundle should contain exactly two packages.' }

      - uses: actions/upload-artifact@v4
        with:
          name: msixbundle-${{ steps.version.outputs.version }}
          path: out/${{ steps.version.outputs.bundle-name }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msixbundle-${{ needs.build.outputs.version }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ needs.build.outputs.bundle-name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
